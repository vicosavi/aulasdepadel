<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#EDF2F7;--surface:#FFFFFF;--ink:#13253A;--muted:#566779;--court:#1D5C9E;--court-2:#164C86;--line:#D3DDE8;--ball:#E2D82C;--ball-ink:#2B2A05;--ok:#2B7A4B;--warn:#A9531C;--danger:#AE2A22;--focus:#E2D82C}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);min-height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1824;--surface:#152435;--ink:#E3EBF3;--muted:#98A9BA;--court:#2867AB;--court-2:#205894;--line:#263B52;--ok:#62BC88;--warn:#E39158;--danger:#F0736A}}
:root[data-theme="dark"]{--bg:#0D1824;--surface:#152435;--ink:#E3EBF3;--muted:#98A9BA;--court:#2867AB;--court-2:#205894;--line:#263B52;--ok:#62BC88;--warn:#E39158;--danger:#F0736A}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-weight:600;line-height:1.1}
h1{font-size:clamp(2.4rem,7vw,3.6rem);margin:0 0 .3rem;font-weight:700}
h2{font-size:1.9rem;margin:0 0 .4rem}
h3{font-size:1.3rem;margin:1.6rem 0 .6rem}
p{margin:.3rem 0 .8rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.lead{color:var(--muted);max-width:60ch}
.empty{color:var(--muted);padding:.8rem 1rem;border:1px dashed var(--line);border-radius:8px}

/* buttons */
.primary,.ghost,.danger{border-radius:8px;padding:.6rem 1rem;font-weight:600;border:1px solid transparent}
.primary{background:var(--court);color:#fff}
.primary:hover{background:var(--court-2)}
.ghost{background:transparent;border-color:var(--line)}
.ghost:hover{border-color:var(--muted)}
.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.small{padding:.3rem .65rem;font-size:.9rem}
.link{background:none;border:0;padding:0;color:var(--court);text-decoration:underline;font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .link{color:#8DB8E8}}

@media (max-width:400px){.top .who{display:none}}
@media (max-width:360px){.drillsbtn{font-size:1.25rem!important;padding:1rem .6rem!important}}
.langsw{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--surface);flex:0 0 auto}
.langsw button{border:0;background:transparent;padding:.35rem .75rem;font-weight:700;font-size:.85rem;color:var(--muted);min-width:2.6rem}
.langsw button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.loginbar{display:flex;justify-content:flex-end;margin:-1rem 0 .8rem}
.top .langsw{background:transparent;border-color:rgba(255,255,255,.6)}
.top .langsw button{color:#fff;padding:.3rem .55rem;min-width:2.2rem}
.top .langsw button[aria-pressed="true"]{background:#fff;color:var(--court)}
@media (pointer:coarse){.langsw button{min-height:40px}}
@media (max-width:520px){.top{gap:.5rem}.top .name{font-size:1.15rem;min-width:0;overflow:hidden;text-overflow:ellipsis}.top .langsw button{padding:.25rem .4rem;min-width:2rem;font-size:.8rem}.top button[data-action=logout]{padding:.3rem .55rem;font-size:.9rem}}
@media (max-width:390px){.top .name{display:none}.top .langsw{margin-left:auto}}
/* login */
.hero{display:flex;align-items:center;gap:1rem}
.hero img{width:clamp(84px,18vw,120px);height:auto;flex:0 0 auto}
.top .mark{width:34px;height:auto;margin-right:-.4rem}
.top .name{white-space:nowrap}
@media (max-width:480px){.top{gap:.6rem;padding:.6rem 1rem}.top .name{font-size:1.25rem}.top .who small{display:none}.top .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:30vw}.top button{flex:0 0 auto}}
.login{max-width:680px;margin:0 auto;padding:2.5rem 1.25rem 3rem}
.login .lead{font-size:1.1rem}
.court{display:grid;grid-template-columns:1fr 12px 1fr;aspect-ratio:2/1;background:var(--court);border:4px solid #fff;border-radius:6px;overflow:hidden;margin:1.6rem 0 1.4rem;box-shadow:0 0 0 1px var(--line)}
.side{position:relative;border:0;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;padding:1rem;text-align:center}
.side::before,.side::after{content:"";position:absolute;background:rgba(255,255,255,.85)}
.side::before{top:0;bottom:0;width:3px}
.side::after{top:calc(50% - 1.5px);height:3px;width:70%}
.side.l::before{left:30%}.side.l::after{right:0}
.side.r::before{right:30%}.side.r::after{left:0}
.side span{position:relative;z-index:1;display:block;background:var(--court);padding:.5rem .75rem;border-radius:6px;transition:background .15s}
.side:hover span,.side:focus-visible span{background:var(--court-2)}
.side b{display:block;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:clamp(1.6rem,5vw,2.2rem);font-weight:700;line-height:1}
.side small{display:block;font-size:.85rem;opacity:.9;margin-top:.2rem;max-width:22ch}
.net{background:repeating-linear-gradient(0deg,#22364B 0 2px,#E8EEF4 2px 5px);border-left:2px solid #fff;border-right:2px solid #fff}
@media (max-width:520px){
 .court{grid-template-columns:1fr;grid-template-rows:1fr 12px 1fr;aspect-ratio:1/1.5}
 .side::before{top:auto;bottom:auto;left:0!important;right:0!important;width:auto;height:3px}
 .side::after{top:auto;left:calc(50% - 1.5px)!important;right:auto!important;width:3px;height:70%}
 .side.l::before{top:30%}.side.l::after{bottom:0}
 .side.r::before{bottom:30%}.side.r::after{top:0}
 .net{background:repeating-linear-gradient(90deg,#22364B 0 2px,#E8EEF4 2px 5px);border:0;border-top:2px solid #fff;border-bottom:2px solid #fff}
}
form.stack{display:grid;gap:.8rem}
label{display:grid;gap:.25rem;font-weight:500}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.6rem .7rem;width:100%}
.err{color:var(--danger);font-weight:500;min-height:1.5em;margin:0}
.demo-note{font-size:.92rem;color:var(--muted);border-left:3px solid var(--ball);padding:.2rem 0 .2rem .8rem;margin-top:1.6rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}

/* app chrome */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--court);color:#fff;display:flex;align-items:center;gap:1rem;padding:.65rem 1.25rem}
.top .name{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:1.5rem;font-weight:700;margin-right:auto}
.top .who{font-size:.95rem;opacity:.95;text-align:right;line-height:1.2}
.top .who small{display:block;opacity:.8}
.top button{background:transparent;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:8px;padding:.35rem .8rem}
.tabs{position:relative;display:flex;gap:.25rem;padding:0 1.25rem;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:.8rem .7rem .65rem;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--court)}
.tabs .tablink{margin-left:auto;align-self:center;white-space:nowrap;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.3rem;line-height:1.1;color:#1B2208;background:var(--ball);border-radius:12px;padding:.7rem 1.5rem;margin-top:.4rem;margin-bottom:.4rem;text-decoration:none;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.tabs .tablink:hover{filter:brightness(.95)}
.drillsbtn{display:none}
@media (max-width:600px){.tabs .tablink{display:none}.drillsbtn{display:block;text-align:center;text-decoration:none;margin:.6rem 0 1.2rem;position:relative;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.45rem;padding:1.1rem 1rem;border-radius:12px;background:var(--ball)!important;color:#1B2208!important;box-shadow:0 2px 0 rgba(0,0,0,.15)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.badge{display:inline-block;min-width:1.4em;padding:0 .35em;border-radius:99px;background:var(--ball);color:var(--ball-ink);font-size:.8rem;text-align:center;margin-left:.2rem}
.view{max-width:1100px;margin:0 auto;padding:1.6rem 1.25rem 4rem}
.banner{background:var(--surface);border-bottom:1px solid var(--line);font-size:.85rem;color:var(--muted);padding:.35rem 1.25rem}

/* day strip */
.daystrip{display:flex;gap:.5rem;overflow-x:auto;padding:.2rem .1rem .6rem;margin:1rem 0 .6rem}
.daychip{flex:0 0 auto;width:4.6rem;display:grid;justify-items:center;gap:0;padding:.5rem .2rem;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.daychip .wd{font-size:.85rem;color:var(--muted)}
.daychip .dn{font-size:1.8rem;line-height:1}
.daychip .cnt{font-size:.75rem;color:var(--muted)}
.daychip[aria-pressed="true"]{background:var(--court);border-color:var(--court);color:#fff}
.daychip[aria-pressed="true"] .wd,.daychip[aria-pressed="true"] .cnt{color:#fff;opacity:.9}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:.45rem .9rem;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* slots */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.6rem}
.slot{display:grid;justify-items:start;gap:.1rem;text-align:left;padding:.7rem .85rem;border-radius:10px;border:1px solid var(--line);background:var(--surface);position:relative}
.slot:hover{border-color:var(--court)}
.slot .t{font-size:1.6rem;line-height:1}
.slot .p{color:var(--muted);font-size:.95rem}
.tag{display:inline-block;font-size:.75rem;font-weight:600;padding:.05rem .45rem;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.peak{background:var(--ball);color:var(--ball-ink);border-color:transparent}
.tag.pending{border-color:var(--warn);color:var(--warn)}
.tag.ok{border-color:var(--ok);color:var(--ok)}
.tag.off{border-color:var(--muted)}
.slot .tag{position:absolute;top:.55rem;right:.6rem}

/* list rows */
.list{display:grid;gap:.6rem}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:.4rem 1rem;align-items:center;padding:.8rem 1rem;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.item .when{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:1.35rem;font-weight:600;line-height:1.05;min-width:5.5rem}
.item .when small{display:block;font-family:Barlow,system-ui,sans-serif;font-size:.8rem;color:var(--muted);font-weight:500}
.item .what{min-width:0}
.item .what b{font-weight:600}
.item .what .sub{color:var(--muted);font-size:.92rem}
.item.muted{opacity:.7}
@media (max-width:560px){.item{grid-template-columns:1fr}.item .acts{justify-content:flex-start}}
.acts{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end}

/* coach week */
.weekbar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:1rem 0}
.weekbar .range{font-weight:600;margin-right:auto}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.5rem}
.dcol{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:9rem;padding:.5rem;display:flex;flex-direction:column;gap:.4rem}
.dcol h4{margin:0 0 .2rem;font-size:.9rem;font-weight:600;color:var(--muted)}
.dcol h4 .cond{font-size:1.4rem;color:var(--ink);margin-right:.2rem}
.dcol.today{border-color:var(--court);box-shadow:inset 0 3px 0 var(--court)}
.bk{text-align:left;border:0;border-left:4px solid var(--court);background:var(--bg);border-radius:6px;padding:.35rem .5rem;font-size:.85rem;line-height:1.3}
.bk .t{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:1.05rem}
.bk.group{border-left-color:var(--ok)}
.bk.pending{border-left-color:var(--ball);border-left-style:dashed}
.bk.cancelled{opacity:.5;text-decoration:line-through}
.dcol .none{color:var(--muted);font-size:.8rem}
@media (max-width:900px){.week{grid-template-columns:1fr}.dcol{min-height:0}}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-top:.6rem}
.legend i{display:inline-block;width:14px;height:10px;border-left:4px solid var(--court);background:var(--bg);margin-right:.3rem;vertical-align:middle}
.legend i.g{border-left-color:var(--ok)}.legend i.p{border-left:4px dashed var(--ball)}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{padding:.55rem .75rem;text-align:left;border-bottom:1px solid var(--line)}
th{font-weight:600;font-size:.9rem;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.avgrid td,.avgrid th{text-align:center;padding:.3rem}
.av{width:100%;min-width:2.6rem;border:1px solid var(--line);background:transparent;border-radius:6px;padding:.3rem 0;font-size:.85rem;color:var(--muted)}
.av[aria-pressed="true"]{background:var(--court);border-color:var(--court);color:#fff}

.big{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:4.5rem;font-weight:700;line-height:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.2rem;margin:1rem 0}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,16,26,.5);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:1rem}
.scrim.open{display:flex}
@media (min-width:640px){.scrim{align-items:center}}
.sheet{background:var(--surface);color:var(--ink);border-radius:14px;max-width:520px;width:100%;max-height:calc(100% - 2rem);overflow:auto;padding:1.3rem 1.3rem 1.1rem;margin-bottom:env(safe-area-inset-bottom,0px)}
.sheet .actions{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1.1rem;flex-wrap:wrap}
dl.sum{display:grid;grid-template-columns:auto 1fr;gap:.35rem 1rem;margin:.8rem 0}
dl.sum dt{color:var(--muted)}
dl.sum dd{margin:0;font-weight:500}
.warnbox{border-left:3px solid var(--warn);padding:.3rem 0 .3rem .8rem;margin:.8rem 0;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(150%);background:var(--ink);color:var(--bg);padding:.7rem 1.1rem;border-radius:10px;font-weight:500;z-index:30;transition:transform .2s,visibility .2s;max-width:calc(100% - 2rem);visibility:hidden}
.toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
@media (prefers-reduced-motion:reduce){.toast,.side span{transition:none}}
</style>
</head>

<div id="root"></div>
<div class="scrim" id="scrim" aria-hidden="true"><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* ---------- datas ---------- */
function pad(n){return String(n).padStart(2,'0')}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function today(){var d=new Date();d.setHours(0,0,0,0);return d}
var WD=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
var WDL=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
var MO=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function fmtDay(s){var d=parse(s);return WD[d.getDay()]+', '+d.getDate()+' '+MO[d.getMonth()]}
function fmtHour(h){return Math.floor(h)+':'+pad(Math.round((h%1)*60))}
function startDT(b){var d=parse(b.date);d.setHours(Math.floor(b.hour),Math.round((b.hour%1)*60),0,0);return d}
function hoursUntil(b){return (startDT(b)-new Date())/36e5}

var PRICES={1:[85,95],2:[40,45],3:[35,40],4:[30,35]};
function isPeak(date,hour){var w=parse(date).getDay();return w===0||w===6||hour>=17}
function price(size,date,hour,dur){var row=PRICES[Math.min(Math.max(size,1),4)];return row[isPeak(date,hour)?1:0]*dur/60}
function groupSize(n){return Math.max(2,n)}
function money(v){return '$'+(Math.round(v)===v?v:v.toFixed(2))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(p){return p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* ---------- regras de agenda ---------- */
function active(b){return b.status==='confirmed'||b.status==='pending'}
function overlaps(date,h,dur,ignore){return S.bookings.some(function(b){return active(b)&&b.id!==ignore&&b.date===date&&h<b.hour+b.dur/60&&b.hour<h+dur/60})}
function freeSlots(date,dur){
  var hrs=S.avail[parse(date).getDay()]||[], now=new Date();
  return hrs.filter(function(h){
    for(var x=h;x<h+dur/60;x++){if(hrs.indexOf(Math.floor(x))<0)return false}
    var st=parse(date);st.setHours(h,0,0,0);if(st<=now)return false;
    return !overlaps(date,h,dur);
  });
}
function openGroups(date){var now=new Date();return S.bookings.filter(function(b){return b.type==='group'&&b.status==='confirmed'&&b.date===date&&startDT(b)>now&&(b.studentIds.length<b.max||b.studentIds.indexOf(me.id)>=0)}).sort(function(a,b){return a.hour-b.hour})}
function bookingPrice(b,size){return b.type==='private'?price(1,b.date,b.hour,b.dur):price(groupSize(size==null?b.studentIds.length:size),b.date,b.hour,b.dur)}
function useCredit(b,u){if(u.credits>0){u.credits--;b.credit=b.credit||{};b.credit[u.id]=true;return true}return false}
function refund(b,id){if(b.credit&&b.credit[id]){var u=user(id);if(u)u.credits=(u.credits||0)+1;delete b.credit[id];return true}return false}
function pendingCount(){return S.bookings.filter(function(b){return b.status==='pending'&&startDT(b)>new Date()}).length+S.packReqs.length}

var F={
  login:function(f){
    var e=f.email.value.trim().toLowerCase(),p=f.pass.value,err=document.getElementById('authErr');
    var u=S.users.find(function(x){return x.email.toLowerCase()===e});
    if(!e||!p){err.textContent='Preencha e-mail e senha.';return}
    if(!u||u.pass!==p){err.textContent='E-mail ou senha não conferem. Na demo, a senha das contas de teste é demo.';return}
    login(u);
  },
  register:function(f){
    var n=f.name.value.trim(),e=f.email.value.trim().toLowerCase(),p=f.pass.value,err=document.getElementById('authErr');
    if(!n||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){err.textContent='Informe nome e um e-mail válido.';return}
    if(p.length<4){err.textContent='A senha precisa ter pelo menos 4 caracteres.';return}
    if(S.users.some(function(x){return x.email.toLowerCase()===e})){err.textContent='Já existe uma conta com esse e-mail. Use Entrar.';return}
    var u={id:uid('u'),role:'student',name:n,email:e,pass:p,level:f.level.value,credits:0};S.users.push(u);save();login(u);toast('Conta criada. Bem-vindo!');
  },
  newGroup:function(f){
    var date=f.date.value,h=+f.hour.value,dur=+f.dur.value,err=document.getElementById('ngErr');
    if(!date){err.textContent='Escolha o dia.';return}
    var st=parse(date);st.setHours(h);if(st<=new Date()){err.textContent='Escolha um horário no futuro.';return}
    if(overlaps(date,h,dur)){err.textContent='Já existe aula nesse horário.';return}
    S.bookings.push({id:uid('b'),date:date,hour:h,dur:dur,type:'group',level:f.level.value,max:+f.max.value,studentIds:[],status:'confirmed',credit:{}});
    closeSheet();commit('Turma criada para '+fmtDay(date)+' às '+h+':00.');
  }

function pad(n){return String(n).padStart(2,'0')}

function user(id){return S.users.find(function(u){return u.id===id})}
function first(id){var u=user(id);return u?u.name.split(' ')[0]:'?'}
var sid=lsGet(SKEY); if(sid){me=user(sid)||null}

/* ---------- regras de agenda ---------- */
function active(b){return b.status==='confirmed'||b.status==='pending'}
function overlaps(date,h,dur,ignore){return S.bookings.some(function(b){return active(b)&&b.id!==ignore&&b.date===date&&h<b.hour+b.dur/60&&b.hour<h+dur/60})}
function freeSlots(date,dur){
  var hrs=S.avail[parse(date).getDay()]||[], now=new Date();
  return hrs.filter(function(h){
    for(var x=h;x<h+dur/60;x++){if(hrs.indexOf(Math.floor(x))<0)return false}
    var st=parse(date);st.setHours(h,0,0,0);if(st<=now)return false;
    return !overlaps(date,h,dur);
  });
}
function openGroups(date){var now=new Date();return S.bookings.filter(function(b){return b.type==='group'&&b.status==='confirmed'&&b.date===date&&startDT(b)>now&&(b.studentIds.length<b.max||b.studentIds.indexOf(me.id)>=0)}).sort(function(a,b){return a.hour-b.hour})}
function bookingPrice(b,size){return b.type==='private'?price(1,b.date,b.hour,b.dur):price(groupSize(size==null?b.studentIds.length:size),b.date,b.hour,b.dur)}
function useCredit(b,u){if(u.credits>0){u.credits--;b.credit=b.credit||{};b.credit[u.id]=true;return true}return false}
function refund(b,id){if(b.credit&&b.credit[id]){var u=user(id);if(u)u.credits=(u.credits||0)+1;delete b.credit[id];return true}return false}
function pendingCount(){return S.bookings.filter(function(b){return b.status==='pending'&&startDT(b)>new Date()}).length+S.packReqs.length}

function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},2800)}
var lastFocus=null;
function openSheet(html){lastFocus=document.activeElement;var s=document.getElementById('sheet');s.innerHTML=html;var sc=document.getElementById('scrim');sc.classList.add('open');sc.setAttribute('aria-hidden','false');var f=s.querySelector('input,textarea,select,.primary,button');if(f)f.focus()}
function closeSheet(){var sc=document.getElementById('scrim');sc.classList.remove('open');sc.setAttribute('aria-hidden','true');document.getElementById('sheet').innerHTML='';if(lastFocus&&document.body.contains(lastFocus))lastFocus.focus()}
function statusTag(b){
  if(b.status==='pending')return '<span class="tag pending">Awaiting confirmation</span>';
  if(b.status==='confirmed')return '<span class="tag ok">Confirmed</span>';
  if(b.status==='declined')return '<span class="tag off">Declined</span>';
  return '<span class="tag off">Cancelled</span>';
}
function kind(b){return b.type==='private'?'Private lesson':lv(b.level)+' group'}

var VIEWS={book:bookView,mine:mineView,pack:packView,agenda:agendaView,students:studentsView,avail:availView,prices:pricesView};
function render(){
  var root=document.getElementById('root');
  if(!me){root.innerHTML=loginHTML();document.title='Padel Lessons: sign in (demo)';return}
  var coach=me.role==='coach';
  var tabs=coach?[['agenda','Schedule'],['students','Students'],['avail','Hours'],['prices','Prices']]:[['book','Book a lesson'],['mine','My lessons'],['pack','Lesson pack']];
  if(!tabs.some(function(t){return t[0]===ui.tab}))ui.tab=tabs[0][0];
  var pend=coach?pendingCount():0;
  var upcoming=!coach?myBookings().filter(function(b){return active(b)&&b.studentIds.indexOf(me.id)>=0&&startDT(b)>new Date()}).length:0;
  root.innerHTML='<header class="top"><img class="mark" src="'+LOGO+'" alt=""><span class="name">Padel Lessons</span><span class="who">'+esc(coach&&me.name==='Professor'?'Coach':me.name)+'<small>'+(coach?'Coach account':esc(lv(me.level))+', '+(me.credits||0)+((me.credits||0)===1?' credit':' credits'))+'</small></span>'+'<div class="langsw" role="group" aria-label="Idioma / Language"><button data-action="lang" data-l="pt" aria-pressed="'+(LANG==='pt')+'" lang="pt">PT</button><button data-action="lang" data-l="en" aria-pressed="'+(LANG==='en')+'" lang="en">EN</button></div>'+'<button data-action="logout">Sign out</button></header>'+
  '<div class="banner">Demo: data stays in this browser only.</div>'+
  '<nav class="tabs" role="tablist">'+tabs.map(function(t){var b=t[0]==='agenda'&&pend?' <span class="badge" aria-label="'+pend+' pending">'+pend+'</span>':t[0]==='mine'&&upcoming?' <span class="badge">'+upcoming+'</span>':'';return '<button role="tab" aria-selected="'+(ui.tab===t[0])+'" data-action="tab" data-tab="'+t[0]+'">'+t[1]+b+'</button>'}).join('')+(coach?'<a class="tablink" href="'+DRILLS_URL+'" target="_blank" rel="noopener">Drills and class mode<span class="sr"> (opens in a new tab)</span></a>':'')+'</nav>'+

  },
  sendPrivate:function(el){
    var date=el.dataset.date,h=+el.dataset.h,dur=+el.dataset.dur;
    if(overlaps(date,h,dur)){closeSheet();commit('That slot was just taken. Please pick another.');return}
    var b={id:uid('b'),date:date,hour:h,dur:dur,type:'private',level:me.level,max:1,studentIds:[me.id],status:'pending',note:(document.getElementById('note').value||'').trim(),credit:{}};
    useCredit(b,user(me.id));S.bookings.push(b);closeSheet();commit('Request sent. The coach will confirm.');
  },
  joinGroup:function(el){
    var b=find(el.dataset.id),n=b.studentIds.length,cr=me.credits||0;
    openSheet('<h2 id="sheetTitle">Join group</h2><dl class="sum"><dt>When</dt><dd>'+fmtDay(b.date)+', '+fmtHour(b.hour)+' to '+fmtHour(b.hour+b.dur/60)+'</dd><dt>Group</dt><dd>'+lv(b.level)+', '+(n+1)+' of '+b.max+' students including you</dd><dt>Price</dt><dd>'+money(bookingPrice(b,n+1))+' per student</dd><dt>Payment</dt><dd>'+(cr?'Uses 1 pack credit (you have '+cr+')':'Goes on the monthly invoice')+'</dd></dl>'+(b.level!==me.level?'<p class="warnbox">This group is '+lv(b.level).toLowerCase()+' level and yours is '+lv(me.level).toLowerCase()+'. The coach may suggest another group.</p>':'')+'<div class="actions"><button class="ghost" data-action="close">Back</button><button class="primary" data-action="doJoin" data-id="'+b.id+'">Join group</button></div>');
  },
  doJoin:function(el){
    var b=find(el.dataset.id);
    if(!b||b.status!=='confirmed'||b.studentIds.length>=b.max){closeSheet();commit('The group is full. Please pick another.');return}
    if(b.studentIds.indexOf(me.id)<0){b.studentIds.push(me.id);useCredit(b,user(me.id))}
    closeSheet();commit('You joined the group.');
  },
  askCancel:function(el){
    var b=find(el.dataset.id),hu=hoursUntil(b),late=hu<24&&b.status==='confirmed',hasCr=b.credit&&b.credit[me.id];
    var msg=b.status==='pending'?'The request is not confirmed yet, so you can withdraw it at no cost'+(hasCr?' and the credit comes back':'')+'.':
      late?'Less than 24 hours to go. Under the rule, the full lesson is charged'+(hasCr?' and the credit used does not come back':'')+'.':
      'More than 24 hours to go, so cancelling is free'+(hasCr?' and the credit goes back to your pack':'')+'.';
    openSheet('<h2 id="sheetTitle">'+(b.status==='pending'?'Withdraw request':'Cancel lesson')+'</h2><dl class="sum"><dt>Lesson</dt><dd>'+kind(b)+'</dd><dt>When</dt><dd>'+fmtDay(b.date)+', '+fmtHour(b.hour)+'</dd></dl><p class="'+(late?'warnbox':'')+'">'+msg+'</p><div class="actions"><button class="ghost" data-action="close">Keep lesson</button><button class="danger" data-action="doCancel" data-id="'+b.id+'">'+(b.status==='pending'?'Withdraw request':late?'Cancel anyway':'Cancel lesson')+'</button></div>');
  },
  doCancel:function(el){
    var b=find(el.dataset.id),late=hoursUntil(b)<24&&b.status==='confirmed';
    if(b.type==='private'){if(!late)refund(b,me.id);b.late=late;b.status='cancelled'}
    else{b.studentIds=b.studentIds.filter(function(x){return x!==me.id});b.cancels=(b.cancels||[]).concat([{uid:me.id,late:late,at:Date.now()}]);if(!late)refund(b,me.id)}
    closeSheet();commit(late?'Lesson cancelled. It will be charged.':'Lesson cancelled.');
  },
  reqPack:function(el){S.packReqs.push({id:uid('p'),uid:me.id,size:+el.dataset.n,at:Date.now()});commit('Pack request sent to the coach.')},
  saveLevel:function(){var u=user(me.id);u.level=document.getElementById('lvl').value;commit('Level saved.')},
  /* professor */
  confirm:function(el){var b=find(el.dataset.id);if(overlaps(b.date,b.hour,b.dur,b.id)&&S.bookings.some(function(x){return x.id!==b.id&&x.status==='confirmed'&&x.date===b.date&&b.hour<x.hour+x.dur/60&&x.hour<b.hour+b.dur/60})){toast('Clashes with another confirmed lesson.');return}b.status='confirmed';closeSheet();commit('Lesson confirmed.')},
  decline:function(el){var b=find(el.dataset.id);b.status='declined';refund(b,b.studentIds[0]);closeSheet();commit('Request declined. The credit went back to the student.')},
  approvePack:function(el){var p=S.packReqs.find(function(x){return x.id===el.dataset.id});var u=user(p.uid);if(u)u.credits=(u.credits||0)+p.size;S.packReqs=S.packReqs.filter(function(x){return x!==p});commit('Pack approved: '+p.size+' credits for '+first(p.uid)+'.')},
  rejectPack:function(el){S.packReqs=S.packReqs.filter(function(x){return x.id!==el.dataset.id});commit('Pack request declined.')},
  cred:function(el){var u=user(el.dataset.id);u.credits=Math.max(0,(u.credits||0)+(+el.dataset.n));commit()},
  av:function(el){var w=+el.dataset.w,h=+el.dataset.h,a=S.avail[w]=S.avail[w]||[],i=a.indexOf(h);if(i>=0)a.splice(i,1);else{a.push(h);a.sort(function(x,y){return x-y})}commit()},
  detail:function(el){
    var b=find(el.dataset.id),future=startDT(b)>new Date(),n=b.studentIds.length;
    var names=b.studentIds.map(function(id){var u=user(id);return '<li class="row" style="justify-content:space-between"><span>'+esc(u?u.name:'?')+' <small style="color:var(--muted)">'+esc(u?lv(u.level):'')+(b.credit&&b.credit[id]?', credit':'')+'</small></span>'+(b.type==='group'&&future&&b.status==='confirmed'?'<button class="ghost small" data-action="kick" data-id="'+b.id+'" data-u="'+id+'">Remove from group</button>':'')+'</li>'}).join('');
    var lateC=(b.cancels||[]).filter(function(c){return c.late}).map(function(c){return first(c.uid)});
    openSheet('<h2 id="sheetTitle">'+kind(b)+'</h2><dl class="sum"><dt>When</dt><dd>'+fmtDay(b.date)+', '+fmtHour(b.hour)+' to '+fmtHour(b.hour+b.dur/60)+'</dd><dt>Status</dt><dd>'+statusTag(b)+'</dd><dt>Price</dt><dd>'+money(bookingPrice(b))+' per student'+(b.type==='group'?', total '+money(bookingPrice(b)*n):'')+(isPeak(b.date,b.hour)?' (peak)':'')+'</dd>'+(b.note?'<dt>Note</dt><dd>'+esc(b.note)+'</dd>':'')+(lateC.length?'<dt>Cancelled late</dt><dd>'+esc(lateC.join(', '))+' (charge)</dd>':'')+'</dl><b>'+(b.type==='group'?'Students ('+n+' of '+b.max+')':'Student')+'</b><ul style="list-style:none;padding:0;margin:.4rem 0;display:grid;gap:.4rem">'+(names||'<li style="color:var(--muted)">No one has joined yet.</li>')+'</ul><div class="actions"><button class="ghost" data-action="close">Close</button>'+(b.status==='pending'?'<button class="ghost" data-action="decline" data-id="'+b.id+'">Decline</button><button class="primary" data-action="confirm" data-id="'+b.id+'">Confirm</button>':'')+(active(b)&&future?'<button class="danger" data-action="coachCancel" data-id="'+b.id+'">Cancel lesson</button>':'')+'</div>');
  },
  kick:function(el){var b=find(el.dataset.id);b.studentIds=b.studentIds.filter(function(x){return x!==el.dataset.u});refund(b,el.dataset.u);closeSheet();commit('Student removed from the group. The credit came back.')},
  coachCancel:function(el){var b=find(el.dataset.id);b.studentIds.forEach(function(id){refund(b,id)});b.status='cancelled';b.late=false;closeSheet();commit('Lesson cancelled. The credits went back to the students.')},
  newGroup:function(){
    var d=ds(addDays(today(),Math.max(1,ui.week*7)));
    var hrs=[];for(var h=6;h<=21;h++)hrs.push(h);
    openSheet('<h2 id="sheetTitle">New group</h2><p class="lead">The group shows up for students, who join on their own until it is full.</p><form class="stack" data-form="newGroup" novalidate><label>Day<input type="date" name="date" value="'+d+'" min="'+ds(today())+'" required></label><div class="row" style="flex-wrap:nowrap"><label style="flex:1">Time<select name="hour">'+hrs.map(function(h){return '<option value="'+h+'"'+(h===18?' selected':'')+'>'+h+':00</option>'}).join('')+'</select></label><label style="flex:1">Length<select name="dur"><option value="60">60 min</option><option value="90">90 min</option></select></label></div><div class="row" style="flex-wrap:nowrap"><label style="flex:1">Level<select name="level">'+LEVELS.map(function(l){return '<option value="'+l+'">'+lv(l)+'</option>'}).join('')+'</select></label><label style="flex:1">Spots<select name="max"><option>2</option><option>3</option><option selected>4</option></select></label></div><p class="err" id="ngErr"></p><div class="actions"><button class="ghost" type="button" data-action="close">Back</button><button class="primary" type="submit">Create group</button></div></form>');
  }
};
var F={
  login:function(f){
    var e=f.email.value.trim().toLowerCase(),p=f.pass.value,err=document.getElementById('authErr');
    var u=S.users.find(function(x){return x.email.toLowerCase()===e});
    if(!e||!p){err.textContent='Enter your email and password.';return}
    if(!u||u.pass!==p){err.textContent='Email or password is incorrect. In the demo, the test account password is demo.';return}
    login(u);
  },
  register:function(f){
    var n=f.name.value.trim(),e=f.email.value.trim().toLowerCase(),p=f.pass.value,err=document.getElementById('authErr');
    if(!n||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){err.textContent='Enter a name and a valid email.';return}
    if(p.length<4){err.textContent='The password needs at least 4 characters.';return}
    if(S.users.some(function(x){return x.email.toLowerCase()===e})){err.textContent='An account with this email already exists. Use Sign in.';return}
    var u={id:uid('u'),role:'student',name:n,email:e,pass:p,level:f.level.value,credits:0};S.users.push(u);save();login(u);toast('Account created. Welcome!');
  },
  newGroup:function(f){
    var date=f.date.value,h=+f.hour.value,dur=+f.dur.value,err=document.getElementById('ngErr');
    if(!date){err.textContent='Pick a day.';return}
    var st=parse(date);st.setHours(h);if(st<=new Date()){err.textContent='Pick a time in the future.';return}
    if(overlaps(date,h,dur)){err.textContent='There is already a lesson at that time.';return}
    S.bookings.push({id:uid('b'),date:date,hour:h,dur:dur,type:'group',level:f.level.value,max:+f.max.value,studentIds:[],status:'confirmed',credit:{}});
    closeSheet();commit('Group created for '+fmtDay(date)+' at '+h+':00.');
  }
};
document.addEventListener('click',function(e){
  var sc=document.getElementById('scrim');if(e.target===sc){closeSheet();return}
  var el=e.target.closest('[data-action]');if(!el)return;
  var fn=A[el.dataset.action];if(fn){e.preventDefault();fn(el)}
});
document.addEventListener('submit',function(e){var f=e.target,fn=F[f.dataset.form];if(fn){e.preventDefault();fn(f)}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&document.getElementById('scrim').classList.contains('open'))closeSheet()});
render();
})();}
(LANG==='en'?APP_EN:APP_PT)();

</script>
</body>
</html>
